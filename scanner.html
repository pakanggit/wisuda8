<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Presensi Wisuda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">
  <div class="w-full max-w-md space-y-4">
    
    <div class="flex items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
      <a href="index.html" class="text-slate-400 hover:text-slate-100"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
      <h1 class="font-bold text-amber-400">Scanner Wisuda</h1>
    </div>

    <!-- Area Video Kamera -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl text-center">
      <div id="reader" class="overflow-hidden rounded-xl bg-slate-950"></div>
      <p class="text-xs text-slate-400 mt-3">Arahkan kamera ke QR Code Tamu</p>
    </div>

    <!-- Status Loading -->
    <div id="loading" class="hidden text-center py-4 bg-slate-800 rounded-xl border border-slate-700">
      <p class="text-amber-400 font-bold animate-pulse">Memproses Presensi...</p>
    </div>

  </div>

  <script src="scanner.js"></script>
</body>
</html>
